<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrida Maluca 20</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:Arial;text-align:center}
input,select,button{padding:12px;border-radius:10px;border:none;font-size:16px;margin:5px}button{background:#22c55e;font-weight:bold}
#pista{width:800px;max-width:95vw;background:#15803d;margin:10px auto;border:4px solid #fff;border-radius:12px;padding:10px}
.linha{height:28px;border-bottom:2px dashed #fff;position:relative;text-align:left}
.carro{position:absolute;left:20px;font-size:22px;transition:0.2s}
#btn{font-size:28px;padding:20px 40px;background:#facc15;border-radius:50%;border:none}
</style></head><body>
<div id="menu"><h1>🏁 CORRIDA MALUCA - 20 ALUNOS</h1>
<input id="nome" placeholder="Seu nome" value="Aluno">
<select id="emoji"><option>🏎️</option><option>🚀</option><option>🐴</option><option>🐢</option><option>🦄</option><option>🛵</option></select>
<input id="codigo" value="TURMA1"><button onclick="entrar()">ENTRAR</button>
<p>Aperte o botão o mais rápido que conseguir! Cuidado com a bomba 💣</p></div>
<div id="jogo" style="display:none">
<h2 id="status">Esperando professor começar...</h2>
<button onclick="comecar()">▶️ PROFESSOR: COMEÇAR</button>
<div id="pista"></div>
<button id="btn" ontouchstart="correr()" onclick="correr()">👆 CORRER!</button>
<p>Toque MUITO rápido!</p></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io();
function entrar(){ socket.emit('entrar',{codigo:document.getElementById('codigo').value,nome:document.getElementById('nome').value,emoji:document.getElementById('emoji').value}); document.getElementById('menu').style.display='none'; document.getElementById('jogo').style.display='block'; }
function comecar(){ socket.emit('comecar'); }
function correr(){ socket.emit('correr'); }
socket.on('cheia', ()=>{ alert('Sala cheia!'); location.reload(); });
socket.on('estado', s=>{
  if(s.vencedor) document.getElementById('status').innerText='🏆 VENCEDOR: '+s.vencedor+' 🏆';
  else if(s.jogando) document.getElementById('status').innerText='🏁 CORRENDO...';
  let pista=document.getElementById('pista'); pista.innerHTML='';
  let rank=Object.values(s.jogadores).sort((a,b)=>b.x-a.x);
  rank.forEach((j,i)=>{
    let d=document.createElement('div'); d.className='linha';
    d.innerHTML=`<div class="carro" style="left:${j.x}px">${j.emoji} <span style="font-size:12px">${i+1}º ${j.nome}</span></div> 🏁`;
    pista.appendChild(d);
  });
});
</script></body></html>
